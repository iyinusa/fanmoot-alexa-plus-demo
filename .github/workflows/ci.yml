# The same commands `make check` runs locally, so a green laptop means a green
# pipeline and a red pipeline is reproducible with one command (W0-6).
#
# Two jobs, because they share nothing: the server's suite needs no built
# bundle (tests/conftest.py writes its own), and the SPA's type check needs no
# Python. Side by side, the slower of the two is the whole wait.
#
# No network in either. The suite runs against its own MCP server on a
# loopback port, a scripted model and a faked authorization server, so a red
# run is this repo's fault and never mcp.fanmoot.com's. The live scenario
# (`make test-live`) is deselected here by pyproject's `-m 'not live'`.

name: check

# Public repository (§2.3), so Actions minutes are free, but a push to a PR
# branch still runs once rather than twice. Prose-only changes are skipped.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    # ADK and LiteLLM are a large install even with uv's cache.
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: |
          uv venv --python 3.12 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Lint
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .

      - name: Types
        run: .venv/bin/mypy app scripts

      - name: Tests
        run: .venv/bin/pytest -q

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v4

      # 22, the Node the Docker image builds with.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Types
        run: npx tsc -b

      # Beyond `tsc -b`: a Tailwind or import error fails here, not in the
      # image build on the host. So does JavaScript over W5-3's budget — the
      # budget is a Vite plugin (web/budget.ts), and it prints its report.
      - name: Build
        run: npx vite build
