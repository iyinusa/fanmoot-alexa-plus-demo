# Production stack for Dokploy.
#
# Two things about this file are load-bearing, as in `fanmoot` and
# `fanmoot-mcp`:
#
#  1. There is NO `ports:` mapping. Dokploy's Traefik routes to this container
#     over the shared `dokploy-network` on its internal port. Publishing 8090
#     binds the host port and bypasses (or collides with) Traefik.
#
#  2. Every FMD_* variable is injected explicitly under `environment:`. Dokploy
#     passes configuration through its UI, not as a committed .env file, so
#     `env_file:` alone would leave the container with nothing.
#
# No database and no volume: the demo is stateless between restarts. A
# visitor's session — their MCP session, conversation and grant — is in this
# process's memory; the grant itself lives on the MCP server. A restart ends
# every session and revokes every visitor's own grant on the way out.

services:
  demo:
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      # ── Environment & identity ──────────────────────────────────────────
      FMD_ENV: ${FMD_ENV:-production}
      FMD_PUBLIC_BASE_URL: ${FMD_PUBLIC_BASE_URL:-https://alexaplus.fanmoot.com}

      # ── The MCP server this demo drives ─────────────────────────────────
      FMD_MCP_URL: ${FMD_MCP_URL:-https://mcp.fanmoot.com/mcp}

      # ── /ws ─────────────────────────────────────────────────────────────
      FMD_WS_ALLOWED_ORIGINS: ${FMD_WS_ALLOWED_ORIGINS:-}

      # ── Visitor sessions ────────────────────────────────────────────────
      FMD_MAX_SESSIONS: ${FMD_MAX_SESSIONS:-200}
      FMD_SESSION_GRACE_S: ${FMD_SESSION_GRACE_S:-300}
      FMD_SESSION_IDLE_S: ${FMD_SESSION_IDLE_S:-3600}
      FMD_SESSION_TURN_CAP: ${FMD_SESSION_TURN_CAP:-40}

      # ── The model chain (HAD-9) ─────────────────────────────────────────
      FMD_MODEL_CHAIN: ${FMD_MODEL_CHAIN:-bedrock/us.amazon.nova-pro-v1:0,bedrock/us.anthropic.claude-sonnet-4-6,gemini/gemini-3.1-flash-lite}
      FMD_AWS_REGION: ${FMD_AWS_REGION:-us-east-1}
      FMD_AWS_ACCESS_KEY_ID: ${FMD_AWS_ACCESS_KEY_ID:-}
      FMD_AWS_SECRET_ACCESS_KEY: ${FMD_AWS_SECRET_ACCESS_KEY:-}
      FMD_AWS_SESSION_TOKEN: ${FMD_AWS_SESSION_TOKEN:-}
      FMD_GEMINI_API_KEY: ${FMD_GEMINI_API_KEY:-}
      FMD_MODEL_PRICES: ${FMD_MODEL_PRICES:-}
      # Empty means the defaults in app/settings.py; `{}` means none (W6-3).
      FMD_PROVIDER_DAILY_CAP_USD: ${FMD_PROVIDER_DAILY_CAP_USD:-}
      FMD_DAILY_CAP_USD: ${FMD_DAILY_CAP_USD:-40}
      FMD_DAILY_TURN_CAP: ${FMD_DAILY_TURN_CAP:-2000}
      FMD_ADDRESS_TURNS_PER_HOUR: ${FMD_ADDRESS_TURNS_PER_HOUR:-60}

      # ── OAuth (W1-7) ────────────────────────────────────────────────────
      FMD_OAUTH_CLIENT_MODE: ${FMD_OAUTH_CLIENT_MODE:-auto}
      FMD_OAUTH_CLIENT_ID: ${FMD_OAUTH_CLIENT_ID:-}
      FMD_OAUTH_CLIENT_SECRET: ${FMD_OAUTH_CLIENT_SECRET:-}

      # ── Alexa's voice and ears: Amazon Polly and Amazon Transcribe ─────
      FMD_VOICE_ENABLED: ${FMD_VOICE_ENABLED:-true}
      FMD_VOICE_ID: ${FMD_VOICE_ID:-Amy}
      FMD_VOICE_ENGINE: ${FMD_VOICE_ENGINE:-generative}
      FMD_VOICE_LANGUAGE: ${FMD_VOICE_LANGUAGE:-en-GB}
      FMD_VOICE_CHARS_PER_SESSION: ${FMD_VOICE_CHARS_PER_SESSION:-15000}
      FMD_LISTEN_SECONDS_PER_SESSION: ${FMD_LISTEN_SECONDS_PER_SESSION:-600}
      FMD_LISTEN_MAX_UTTERANCE_S: ${FMD_LISTEN_MAX_UTTERANCE_S:-30}

      # ── Operator ────────────────────────────────────────────────────────
      FMD_ADMIN_TOKEN: ${FMD_ADMIN_TOKEN:-}

    expose:
      - "8090"

    command: >
      gunicorn app.main:app
      -k uvicorn.workers.UvicornWorker
      -b 0.0.0.0:8090
      --workers 1
      --timeout 90
      --graceful-timeout 30

    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8090/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - dokploy-network

networks:
  # Created by Dokploy on its host. Locally, `make up` creates it once.
  dokploy-network:
    external: true
