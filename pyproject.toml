[project]
name = "fanmoot-alexa-plus-demo"
version = "0.1.0"
description = "Fanmoot on Alexa+ — a web simulation of the voice experience, driving the real Fanmoot MCP server with every frame on show."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

# W0 carries only what the skeleton serves: the SPA, `/healthz` and `/ws`. The
# agent runtime's dependencies — google-adk, litellm, the `mcp` client SDK and
# boto3 — arrive with W1, which is the milestone that imports them.
dependencies = [
    # ── Web ──────────────────────────────────────────────────────────────────
    "fastapi>=0.115",
    # `[standard]` brings the `websockets` implementation `/ws` runs on.
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",

    # ── Config & validation ──────────────────────────────────────────────────
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # ── Infrastructure ───────────────────────────────────────────────────────
    "httpx>=0.27",
    "structlog>=24.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",  # a hung test fails in seconds, not at the CI job limit
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Lint ─────────────────────────────────────────────────────────────────────
# Same rule set as `fanmoot` and `fanmoot-mcp`, so a reviewer moving between the
# three repos reads one style rather than three.
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "C4", "SIM"]
ignore = [
    "B008",  # FastAPI declares dependencies in default args by design
]

[tool.ruff.lint.per-file-ignores]
# asserts and fake credentials in tests; ASYNC240 guards request handlers from
# stalling the event loop, which a test writing a fixture file does not.
"tests/*" = ["S101", "S105", "S106", "ASYNC240"]
"tests/conftest.py" = ["E402"]                # env must be set before app imports

# ── Types ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# ── Tests ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    # Starlette's own notice about its test client's transport — about the
    # library, not about anything this suite does.
    "ignore:Using `httpx` with `starlette.testclient`",
]
# A test still running after 30 s is hung, not slow.
timeout = 30
