[project]
name = "fanmoot-alexa-plus-demo"
version = "0.1.0"
description = "Fanmoot on Alexa+ — a web simulation of the voice experience, driving the real Fanmoot MCP server with every frame on show."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }

dependencies = [
    # ── Web ──────────────────────────────────────────────────────────────────
    "fastapi>=0.115",
    # `[standard]` brings the `websockets` implementation `/ws` runs on.
    "uvicorn[standard]>=0.30",
    "gunicorn>=22.0",

    # ── Config & validation ──────────────────────────────────────────────────
    "pydantic>=2.7",
    "pydantic-settings>=2.3",

    # ── Infrastructure ───────────────────────────────────────────────────────
    "httpx>=0.27",
    "structlog>=24.1",

    # ── The agent (W1, HAD-9) ────────────────────────────────────────────────
    # The same ADK and LiteLLM `fanmoot/app/agents` runs on. ADK's 2.x line
    # moves fast, so the floor is the release this was built and tested on.
    "google-adk>=2.9,<3",
    "litellm>=1.100,<2",
    # Bedrock through LiteLLM needs boto3 (and its credential chain).
    "boto3>=1.34",
    # Alexa's ears: the stream to Amazon Transcribe (app/voice/listen.py).
    # Already here through uvicorn[standard]; named because it is imported.
    "websockets>=13",
    "certifi",
    # The MCP client. Same pin as fanmoot-mcp: the 1.x line speaks the
    # handshake era, and `2025-11-25` is what the track turns on (HAD-2).
    "mcp>=1.30,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-timeout>=2.3",  # a hung test fails in seconds, not at the CI job limit
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ── Lint ─────────────────────────────────────────────────────────────────────
# Same rule set as `fanmoot` and `fanmoot-mcp`, so a reviewer moving between the
# three repos reads one style rather than three.
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "C4", "SIM"]
ignore = [
    "B008",  # FastAPI declares dependencies in default args by design
]

[tool.ruff.lint.per-file-ignores]
# asserts and fake credentials in tests; ASYNC240 guards request handlers from
# stalling the event loop, which a test writing a fixture file does not.
"tests/*" = ["S101", "S105", "S106", "ASYNC240"]
"tests/conftest.py" = ["E402"]                # env must be set before app imports

# ── Types ────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# google-adk and litellm ship py.typed but move which callables carry
# annotations between releases, so an ignore that is correct in CI can be
# redundant in a dev venv — `fanmoot`'s own override, for the same modules.
[[tool.mypy.overrides]]
module = ["app.agent.*"]
warn_unused_ignores = false

# ── Tests ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning",
    # Starlette's own notice about its test client's transport — about the
    # library, not about anything this suite does.
    "ignore:Using `httpx` with `starlette.testclient`",
]
# A test still running after 30 s is hung, not slow.
timeout = 30
# `live` tests reach mcp.fanmoot.com (and, with FMD_LIVE_MODEL=1, a model
# provider). They are deselected unless asked for: `make test-live`.
markers = ["live: talks to the deployed MCP server; run with `make test-live`"]
addopts = "-m 'not live'"
