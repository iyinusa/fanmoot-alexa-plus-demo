<!doctype html>
<!-- Dark unless the visitor chose otherwise, set in the markup so the first
     paint is already right. Floodlit is dark-first (tokens.css). -->
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fanmoot on Alexa+ — where fans debate football, by voice</title>
    <meta
      name="description"
      content="Ask about a match out loud and hear what fans are saying — Fanmoot's MCP server, driven by voice, with every frame on show."
    />
    <!-- A file, not inline, so the CSP can say script-src 'self' (app/middleware.py). -->
    <script src="/theme.js"></script>

    <meta name="theme-color" content="#0b0f14" />
    <link rel="icon" href="/icons/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- On the critical path; `crossorigin` is required even same-origin, or
         the font downloads twice. -->
    <link rel="preload" href="/fonts/lato-400.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/lato-900.woff2" as="font" type="font/woff2" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div style="padding:2rem;font-family:system-ui">
        <h1>Fanmoot on Alexa+</h1>
        <p>The demo needs JavaScript.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
